<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw your tablet unlock pattern</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e8eaf0; display: flex; justify-content: center; }
  main { width: 100%; max-width: 420px; padding: 20px 16px 32px; }
  h1 { font-size: 22px; margin: 4px 0 6px; }
  h2 { font-size: 15px; color: #a6abb8; margin: 22px 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-weight: 400; font-size: 12px; }
  p.sub { margin: 0 0 14px; color: #a6abb8; font-size: 15px; line-height: 1.4; }
  .tries { display: flex; gap: 8px; margin-bottom: 12px; }
  .chip { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; background: #1b1f27; border: 1px solid #2a2f3a; font-size: 13px; color: #a6abb8; }
  .chip.done { border-color: #3ccf8e; color: #3ccf8e; }
  .chip.now { border-color: #6aa8ff; color: #6aa8ff; }
  .pad { position: relative; width: 100%; aspect-ratio: 1; background: #161a21; border-radius: 18px; touch-action: none; user-select: none; }
  .pad.locked { opacity: .45; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 18px; }
  .seq { margin: 12px 0; font-size: 18px; text-align: center; letter-spacing: 1px; }
  .row { display: flex; gap: 10px; }
  button { flex: 1; padding: 14px 10px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
  .primary { background: #6aa8ff; color: #0b1020; }
  .ghost { background: #232834; color: #e8eaf0; }
  button:disabled { opacity: .4; cursor: default; }
  .note { font-size: 13px; color: #a6abb8; text-align: center; margin-top: 8px; min-height: 18px; }
  .item { display: flex; align-items: center; gap: 12px; background: #1b1f27; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .item canvas { width: 64px; height: 64px; flex: none; background: #161a21; border-radius: 8px; }
  .item .t { font-size: 15px; }
  .item .t small { display: block; color: #a6abb8; font-size: 12px; margin-top: 2px; }
  .empty { color: #6b7180; font-size: 14px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ccf8e; margin-right: 6px; vertical-align: middle; }
  .live.off { background: #e5484d; }
</style>
</head>
<body>
<main>
  <h1>Draw your tablet unlock pattern</h1>

  <div class="tries" id="chips"></div>

  <div class="pad" id="pad"><canvas id="cv"></canvas></div>
  <div class="seq"></div>

  <div class="row">
    <button class="ghost" id="clear">Clear</button>
    <button class="primary" id="save" disabled>Save try 1</button>
  </div>
  <div class="note" id="note"></div>

  <h2>Saved tries <small id="status"><span class="live" id="dot"></span>connecting…</small></h2>
  <div id="tries"><div class="empty">No tries saved yet</div></div>

  <h2>Every pattern drawn <small>newest first</small></h2>
  <div id="drawn"><div class="empty">Nothing drawn yet</div></div>
</main>

<script>
const API = '/api/password-attempts';
const pad = document.getElementById('pad');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let path = [], drawing = false, cursor = null, busy = false;
let server = { used: 0, max: 3, tries: [], drawn: [] }, lastOk = 0, lastKey = '';

let session = null;
try { session = localStorage.getItem('pattern-session'); } catch {}
if (!session || !/^[a-z0-9]{8,40}$/.test(session)) {
  session = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).replace(/[^a-z0-9]/g, '');
  try { localStorage.setItem('pattern-session', session); } catch {}
}

const full = () => server.used >= server.max;

function size() {
  const r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  render();
}
function centers(w) {
  const c = [];
  for (let i = 0; i < 9; i++) c.push({ x: w * (0.2 + 0.3 * (i % 3)), y: w * (0.2 + 0.3 * Math.floor(i / 3)) });
  return c;
}
function drawPattern(g, w, p, cur) {
  const c = centers(w), rDot = w * 0.035;
  g.clearRect(0, 0, w, w);
  if (p.length) {
    g.strokeStyle = 'rgba(106,168,255,.85)'; g.lineWidth = Math.max(2, w * 0.022); g.lineCap = g.lineJoin = 'round';
    g.beginPath(); g.moveTo(c[p[0]].x, c[p[0]].y);
    p.slice(1).forEach(i => g.lineTo(c[i].x, c[i].y));
    if (cur) g.lineTo(cur.x, cur.y);
    g.stroke();
  }
  c.forEach((pt, i) => {
    const on = p.includes(i);
    if (on) { g.fillStyle = 'rgba(106,168,255,.18)'; g.beginPath(); g.arc(pt.x, pt.y, rDot * 2.6, 0, 7); g.fill(); }
    g.fillStyle = on ? '#6aa8ff' : '#5b6170';
    g.beginPath(); g.arc(pt.x, pt.y, on ? rDot * 1.3 : rDot, 0, 7); g.fill();
  });
  if (p.length) {
    const s = c[p[0]]; g.strokeStyle = '#3ccf8e'; g.lineWidth = Math.max(1.5, w * 0.01);
    g.beginPath(); g.arc(s.x, s.y, rDot * 2.6, 0, 7); g.stroke();
  }
}
function render() { drawPattern(ctx, pad.getBoundingClientRect().width, path, drawing ? cursor : null); }

function local(e) { const r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hit(pt) {
  const w = pad.getBoundingClientRect().width, c = centers(w);
  for (let i = 0; i < 9; i++) if (Math.hypot(c[i].x - pt.x, c[i].y - pt.y) < w * 0.11) return i;
  return -1;
}
function add(i) {
  if (path.includes(i)) return;
  if (path.length) { // auto-include a skipped middle dot, like Android does
    const a = path[path.length - 1], ar = Math.floor(a / 3), ac = a % 3, br = Math.floor(i / 3), bc = i % 3;
    if ((ar + br) % 2 === 0 && (ac + bc) % 2 === 0) {
      const m = ((ar + br) / 2) * 3 + (ac + bc) / 2;
      if (!path.includes(m)) path.push(m);
    }
  }
  path.push(i);
}
pad.addEventListener('pointerdown', e => {
  if (full()) return;
  try { pad.setPointerCapture(e.pointerId); } catch {}
  path = []; drawing = true; cursor = local(e);
  const i = hit(cursor); if (i >= 0) add(i);
  update();
});
pad.addEventListener('pointermove', e => {
  if (!drawing) return;
  cursor = local(e); const i = hit(cursor); if (i >= 0) add(i);
  render();
});
const end = () => {
  if (!drawing) return; drawing = false;
  if (path.length >= 2) post('drawn', path.slice());
  update();
};
pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);

const seqText = p => p.map(i => i + 1).join(' → ');
function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  return new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function showSeq() {}
function note(t) { document.getElementById('note').textContent = t || ''; }

function update() {
  render(); showSeq();
  pad.classList.toggle('locked', full());
  const saveBtn = document.getElementById('save');
  saveBtn.disabled = full() || drawing || busy || path.length < 2;
  saveBtn.textContent = full() ? 'All tries used' : `Save try ${server.used + 1}`;
  document.getElementById('clear').disabled = !path.length;
  const chips = document.getElementById('chips'); chips.innerHTML = '';
  for (let k = 0; k < server.max; k++) {
    const d = document.createElement('div');
    d.className = 'chip' + (k < server.used ? ' done' : k === server.used ? ' now' : '');
    d.textContent = `Try ${k + 1}` + (k < server.used ? ' ✓' : '');
    chips.appendChild(d);
  }
}

function listItem(p, title, sub) {
  const it = document.createElement('div'); it.className = 'item';
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.scale(2, 2); drawPattern(g, 64, p, null);
  const tx = document.createElement('div'); tx.className = 't';
  tx.textContent = title;
  const sm = document.createElement('small'); sm.textContent = sub; tx.appendChild(sm);
  it.append(c, tx); return it;
}
function renderLists() {
  const key = JSON.stringify([server.tries, server.drawn]);
  const t = document.getElementById('tries'), d = document.getElementById('drawn');
  if (key !== lastKey) {
    lastKey = key;
    t.innerHTML = ''; d.innerHTML = '';
    if (!server.tries.length) t.innerHTML = '<div class="empty">No tries saved yet</div>';
    server.tries.forEach((x, k) => t.appendChild(listItem(x.pattern, `Try ${k + 1}`, ago(x.at))));
    if (!server.drawn.length) d.innerHTML = '<div class="empty">Nothing drawn yet</div>';
    server.drawn.slice().reverse().forEach(x => d.appendChild(listItem(x.pattern, 'Drawn', ago(x.at))));
  } else {
    // refresh "x ago" labels only
    t.querySelectorAll('small').forEach((s, k) => server.tries[k] && (s.textContent = ago(server.tries[k].at)));
    const rev = server.drawn.slice().reverse();
    d.querySelectorAll('small').forEach((s, k) => rev[k] && (s.textContent = ago(rev[k].at)));
  }
}

function setStatus() {
  const okRecently = Date.now() - lastOk < 15000;
  document.getElementById('status').innerHTML =
    `<span class="live${okRecently ? '' : ' off'}"></span>` + (okRecently ? 'live' : 'reconnecting…');
}

function apply(data) {
  if (data && Array.isArray(data.tries)) {
    server = { used: data.used, max: data.max, tries: data.tries, drawn: data.drawn || [] };
  } else if (data && typeof data.used === 'number') {
    server.used = data.used;
  }
  lastOk = Date.now();
  update(); renderLists(); setStatus();
}

async function refresh() {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (r.ok) apply(await r.json());
  } catch {}
  setStatus();
}

async function post(action, pattern) {
  const r = await fetch(API, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session, pattern, action }),
  });
  const data = await r.json().catch(() => ({}));
  if (typeof data.used === 'number') server.used = data.used;
  refresh();
  return { ok: r.ok, status: r.status, data };
}

document.getElementById('clear').onclick = () => { path = []; note(''); update(); };
document.getElementById('save').onclick = async () => {
  if (path.length < 2 || full() || busy) return;
  busy = true; update(); note('Saving…');
  const p = path.slice();
  try {
    const res = await post('save', p);
    if (res.ok) { path = []; note(`Saved as try ${res.data.used}`); }
    else if (res.status === 409) { path = []; note('All 3 tries are already used'); }
    else note('Could not save — check your internet and tap Save again');
  } catch { note('Could not save — check your internet and tap Save again'); }
  busy = false; update();
};

window.addEventListener('resize', size);
size(); update(); refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
