<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw your tablet unlock pattern</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { touch-action: manipulation; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e8eaf0; display: flex; justify-content: center; }
  main { width: 100%; max-width: 420px; padding: 20px 16px 32px; }
  h1 { font-size: 22px; margin: 4px 0 20px; }
  h2 { font-size: 15px; color: #a6abb8; margin: 22px 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-weight: 400; font-size: 12px; }
  p.sub { margin: 0 0 14px; color: #a6abb8; font-size: 15px; line-height: 1.4; }
  .tries { display: flex; gap: 8px; margin-bottom: 24px; }
  .chip { flex: 1; font: inherit; cursor: pointer; text-align: center; padding: 8px 4px; border-radius: 10px; background: #1b1f27; border: 1px solid #2a2f3a; font-size: 13px; color: #a6abb8; }
  .chip.done { border-color: #3ccf8e; color: #3ccf8e; }
  .chip.now { border-color: #6aa8ff; color: #6aa8ff; }
  .chip.sel { background: #26324a; font-weight: 600; }
  .chip:disabled { cursor: default; opacity: .5; }
  .pad { position: relative; width: 100%; aspect-ratio: 1; background: #161a21; border-radius: 18px; touch-action: none; user-select: none; }
  .pad.locked { opacity: .45; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 18px; }
  .seq { margin: 12px 0; font-size: 18px; text-align: center; letter-spacing: 1px; }
  .row { display: flex; gap: 10px; }
  button { flex: 1; padding: 14px 10px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
  .primary { background: #6aa8ff; color: #0b1020; }
  .ghost { background: #232834; color: #e8eaf0; }
  .danger { background: #e5484d; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .note { font-size: 13px; color: #a6abb8; text-align: center; margin-top: 8px; min-height: 18px; }
  .item { display: flex; align-items: center; gap: 12px; background: #1b1f27; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .item canvas { width: 64px; height: 64px; flex: none; background: #161a21; border-radius: 8px; }
  .item .t { font-size: 15px; }
  .item .t small { display: block; color: #a6abb8; font-size: 12px; margin-top: 2px; }
  .empty { color: #6b7180; font-size: 14px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ccf8e; margin-right: 6px; vertical-align: middle; }
  .live.off { background: #e5484d; }
</style>
</head>
<body>
<main>
  <h1>Draw your tablet unlock pattern</h1>

  <div class="tries" id="chips"></div>

  <div class="pad" id="pad"><canvas id="cv"></canvas></div>
  <div class="seq"></div>

  <div class="row" id="actions">
    <button class="ghost" id="clear">Clear</button>
    <button class="primary" id="save" disabled>Save try 1</button>
  </div>
  <div class="note" id="note"></div>

  <div class="note" id="status"></div>
</main>

<script>
const API = '/api/password-attempts';
const pad = document.getElementById('pad');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let path = [], drawing = false, cursor = null, busy = false, armedClear = false;
let server = { used: 0, max: 3, tries: [null, null, null] }, lastOk = 0, selected = null;

let session = null;
try { session = localStorage.getItem('pattern-session'); } catch {}
if (!session || !/^[a-z0-9]{8,40}$/.test(session)) {
  session = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).replace(/[^a-z0-9]/g, '');
  try { localStorage.setItem('pattern-session', session); } catch {}
}

const slotTry = () => (selected === null ? null : server.tries[selected]); // saved pattern in the open tab
const viewing = () => !!slotTry();
function defaultTab() { const i = server.tries.findIndex(t => !t); return i === -1 ? 0 : i; }

function size() {
  const r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  render();
}
function centers(w) {
  const c = [];
  for (let i = 0; i < 9; i++) c.push({ x: w * (0.2 + 0.3 * (i % 3)), y: w * (0.2 + 0.3 * Math.floor(i / 3)) });
  return c;
}
function drawPattern(g, w, p, cur) {
  const c = centers(w), rDot = w * 0.035;
  g.clearRect(0, 0, w, w);
  if (p.length) {
    g.strokeStyle = 'rgba(106,168,255,.85)'; g.lineWidth = Math.max(2, w * 0.022); g.lineCap = g.lineJoin = 'round';
    g.beginPath(); g.moveTo(c[p[0]].x, c[p[0]].y);
    p.slice(1).forEach(i => g.lineTo(c[i].x, c[i].y));
    if (cur) g.lineTo(cur.x, cur.y);
    g.stroke();
  }
  c.forEach((pt, i) => {
    const on = p.includes(i);
    if (on) { g.fillStyle = 'rgba(106,168,255,.18)'; g.beginPath(); g.arc(pt.x, pt.y, rDot * 2.6, 0, 7); g.fill(); }
    g.fillStyle = on ? '#6aa8ff' : '#5b6170';
    g.beginPath(); g.arc(pt.x, pt.y, on ? rDot * 1.3 : rDot, 0, 7); g.fill();
  });
  if (p.length) {
    const s = c[p[0]]; g.strokeStyle = '#3ccf8e'; g.lineWidth = Math.max(1.5, w * 0.01);
    g.beginPath(); g.arc(s.x, s.y, rDot * 2.6, 0, 7); g.stroke();
  }
}
function render() {
  const w = pad.getBoundingClientRect().width, t = slotTry();
  if (t) drawPattern(ctx, w, t.pattern, null);
  else drawPattern(ctx, w, path, drawing ? cursor : null);
}

function local(e) { const r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hit(pt) {
  const w = pad.getBoundingClientRect().width, c = centers(w);
  for (let i = 0; i < 9; i++) if (Math.hypot(c[i].x - pt.x, c[i].y - pt.y) < w * 0.11) return i;
  return -1;
}
function add(i) {
  if (path.includes(i)) return;
  if (path.length) { // auto-include a skipped middle dot, like Android does
    const a = path[path.length - 1], ar = Math.floor(a / 3), ac = a % 3, br = Math.floor(i / 3), bc = i % 3;
    if ((ar + br) % 2 === 0 && (ac + bc) % 2 === 0) {
      const m = ((ar + br) / 2) * 3 + (ac + bc) / 2;
      if (!path.includes(m)) path.push(m);
    }
  }
  path.push(i);
}
pad.addEventListener('pointerdown', e => {
  if (viewing() || busy) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch {}
  path = []; drawing = true; cursor = local(e); disarm();
  const i = hit(cursor); if (i >= 0) add(i);
  update();
});
pad.addEventListener('pointermove', e => {
  if (!drawing) return;
  cursor = local(e); const i = hit(cursor); if (i >= 0) add(i);
  render();
});
const end = () => {
  if (!drawing) return; drawing = false;
  if (path.length >= 2) post({ action: 'drawn', pattern: path.slice() });
  update();
};
pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);

function note(t) { $('note').textContent = t || ''; }
function disarm() { if (armedClear) { armedClear = false; } }

function update() {
  render();
  const t = slotTry(), n = selected === null ? 1 : selected + 1;
  const saveBtn = $('save'), clearBtn = $('clear');
  saveBtn.style.display = t ? 'none' : '';
  saveBtn.disabled = drawing || busy || path.length < 2;
  saveBtn.textContent = `Save try ${n}`;
  clearBtn.disabled = busy;
  clearBtn.textContent = t ? (armedClear ? `Tap again to clear try ${n}` : `Clear try ${n}`) : 'Clear';
  clearBtn.className = t && armedClear ? 'danger' : 'ghost';
  const chips = $('chips'); chips.innerHTML = '';
  for (let k = 0; k < server.max; k++) {
    const d = document.createElement('button');
    const used = !!server.tries[k];
    d.className = 'chip' + (used ? ' done' : k === selected ? ' now' : '') + (k === selected ? ' sel' : '');
    d.textContent = `Try ${k + 1}` + (used ? ' ✓' : '');
    d.onclick = () => { selected = k; drawing = false; path = []; armedClear = false; note(''); update(); };
    chips.appendChild(d);
  }
}

function setStatus() {
  const okRecently = Date.now() - lastOk < 15000;
  $('status').innerHTML = okRecently ? '' : '<span class="live off"></span>reconnecting…';
}

function apply(data) {
  if (!data || !Array.isArray(data.tries)) return;
  const wasViewing = viewing();
  server = { used: data.used, max: data.max, tries: data.tries };
  if (selected === null) selected = defaultTab(); // first load: open the first empty try
  if (wasViewing && !viewing()) armedClear = false; // someone else cleared it
  lastOk = Date.now();
  update(); setStatus();
}

async function refresh() {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (r.ok) apply(await r.json());
  } catch {}
  setStatus();
}

async function post(body) {
  const r = await fetch(API, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session, ...body }),
  });
  const data = await r.json().catch(() => ({}));
  apply(data);
  return { ok: r.ok, status: r.status, data };
}

$('clear').onclick = async () => {
  if (busy) return;
  if (!viewing()) { path = []; drawing = false; cursor = null; note(''); update(); return; }
  if (!armedClear) { armedClear = true; update(); return; }
  busy = true; armedClear = false; update(); note('Clearing…');
  try {
    const res = await post({ action: 'clear', slot: selected });
    note(res.ok ? `Try ${selected + 1} cleared — draw it again` : 'Could not clear — tap again');
  } catch { note('Could not clear — check your internet'); }
  busy = false; update();
};
$('save').onclick = async () => {
  if (path.length < 2 || viewing() || busy) return;
  busy = true; update(); note('Saving…');
  try {
    const res = await post({ action: 'save', slot: selected, pattern: path.slice() });
    if (res.ok) { path = []; note(`Saved as try ${selected + 1}`); }
    else if (res.status === 409) { path = []; note(`Try ${selected + 1} was just saved by someone else`); }
    else note('Could not save — check your internet and tap Save again');
  } catch { note('Could not save — check your internet and tap Save again'); }
  busy = false; update();
};

// Stop pinch / double-tap zoom (iOS ignores user-scalable=no).
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 350 && !e.target.closest('button')) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

window.addEventListener('resize', size);
size(); update(); refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
